<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title description">
  <title id="title">vsced dark editor preview</title>
  <desc id="description">A dark VS Code-style editor preview showing JavaScript, Python, C, and JSON with the vsced dark palette.</desc>
  <defs>
    <style>
      .ui { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { font: 15px "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #777b84; }
      .text { fill: #b7b8b2; }
      .cyan { fill: #61c8ff; }
      .lime { fill: #a6e22e; }
      .orange { fill: #ffad43; }
      .hot { fill: #ff8738; }
      .purple { fill: #d3a0ff; }
      .comment { fill: #626e7c; }
      .line { fill: #4b5059; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0d1117"/>
  <rect width="1600" height="40" fill="#191b21"/>
  <circle cx="22" cy="20" r="6" fill="#f45b69"/><circle cx="44" cy="20" r="6" fill="#ffad43"/><circle cx="66" cy="20" r="6" fill="#a6e22e"/>
  <text x="94" y="25" class="ui" fill="#d4d5d8">vsced dark</text>
  <text x="1500" y="25" class="ui muted" text-anchor="end">editor preview</text>
  <rect y="40" width="260" height="960" fill="#1f2024"/>
